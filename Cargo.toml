[package]
name = "packetworks"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["xtask"]
resolver = "3"

[dependencies]
anyhow = "1"
confique = "0.4"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

version: 2.1

jobs:
  ci:
    docker:
      - image: cimg/rust:1.91
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Run xtask CI
          command: cargo ci
      - run:
          name: Collect binaries
          command: |
            mkdir -p /tmp/artifacts/debug /tmp/artifacts/release
            cp target/debug/relay /tmp/artifacts/debug/relay
            cp target/debug/sink /tmp/artifacts/debug/sink
            cp target/debug/source /tmp/artifacts/debug/source
            cp target/release/relay /tmp/artifacts/release/relay
            cp target/release/sink /tmp/artifacts/release/sink
            cp target/release/source /tmp/artifacts/release/source
      - store_artifacts:
          path: /tmp/artifacts/debug
          destination: binaries/debug
      - store_artifacts:
          path: /tmp/artifacts/release
          destination: binaries/release

workflows:
  ci:
    jobs:
      - ci
